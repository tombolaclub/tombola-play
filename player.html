<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tambola Player</title>

<style>

body{
margin:0;
padding:10px;
font-family:Arial,sans-serif;
background:#f2f2f2;
}

.box{
background:white;
padding:12px;
border-radius:12px;
margin-bottom:10px;
}

.btn{
width:100%;
padding:12px;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
background:#1976d2;
margin-top:10px;
}

.bookBtn{
background:#4caf50;
}

.ticket{
border:4px solid gold;
border-radius:10px;
margin-top:15px;
overflow:hidden;
background:white;
}

.ticketHeader{
display:flex;
justify-content:space-between;
background:#3366ff;
color:white;
padding:10px;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(9,1fr);
gap:2px;
padding:6px;
background:#ddd;
}

.cell{
background:#fff;
height:48px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
}

.empty{
background:#efefef;
}

.sold{
background:yellow;
}

input{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

#playerPage{
display:none;
}

</style>
</head>

<body>

<div id="announcement" class="box">

<h2 align="center">🎉 ANNOUNCEMENT 🎉</h2>

<p>✅ Welcome to Tambola Game</p>
<p>✅ Check ticket carefully</p>
<p>✅ Fair play only</p>

<button class="btn" onclick="startGame()">
I ACCEPT
</button>

</div>

<div id="playerPage">

<div class="box">

<h3 id="countInfo"></h3>

<input
type="number"
id="ticketNo"
placeholder="Ticket Number">

<input
type="text"
id="playerName"
placeholder="Your Name">

<button
class="btn bookBtn"
onclick="bookTicket()">
BOOK TICKET
</button>

</div>

<div id="tickets"></div>

</div>

<script>

function startGame(){

document.getElementById(
"announcement"
).style.display="none";

document.getElementById(
"playerPage"
).style.display="block";

loadTickets();

}

function randomTicket(){

let ticket=[];

for(let r=0;r<3;r++){

let row=[];

for(let c=0;c<9;c++){

row.push("");

}

ticket.push(row);

}

let nums=[];

while(nums.length<15){

let n=
Math.floor(Math.random()*90)+1;

if(!nums.includes(n))
nums.push(n);

}

let k=0;

while(k<15){

let r=
Math.floor(Math.random()*3);

let c=
Math.floor(Math.random()*9);

if(ticket[r][c]===""){

ticket[r][c]=nums[k];
k++;

}

}

return ticket;

}

function loadTickets(){

let total=
parseInt(
localStorage.getItem(
"ticketCount"
)||0
);

let tickets=
JSON.parse(
localStorage.getItem(
"allTickets"
)||"[]"
);

if(tickets.length===0){

for(let i=1;i<=total;i++){

tickets.push({

id:i,
grid:randomTicket(),
owner:""

});

}

localStorage.setItem(
"allTickets",
JSON.stringify(tickets)
);

}

document.getElementById(
"countInfo"
).innerHTML=
"🎫 Total Tickets: "+total;

renderTickets();

}

function renderTickets(){

let tickets=
JSON.parse(
localStorage.getItem(
"allTickets"
)||"[]"
);

let html="";

tickets.forEach(t=>{

html+=`

<div class="ticket">

<div class="ticketHeader">

<div>
${t.id} :
${t.owner?
t.owner:
"(UNSOLD)"}
</div>

<div>
${t.owner?
"SOLD":
"BOOK THIS"}
</div>

</div>

<div class="grid">

`;

for(let r=0;r<3;r++){

for(let c=0;c<9;c++){

let v=t.grid[r][c];

html+=`
<div class="cell ${
v===""?"empty":""
}">
${v}
</div>
`;

}

}

html+=`
</div>
</div>
`;

});

document.getElementById(
"tickets"
).innerHTML=html;

}

function bookTicket(){

let no=
parseInt(
document.getElementById(
"ticketNo"
).value
);

let name=
document.getElementById(
"playerName"
).value;

if(!no || !name){

alert("Enter ticket and name");
return;

}

let tickets=
JSON.parse(
localStorage.getItem(
"allTickets"
)||"[]"
);

let found=false;

tickets.forEach(t=>{

if(t.id===no){

if(t.owner){

alert("Already Booked");

}else{

t.owner=name;
found=true;

}

}

});

if(!found){

alert("Ticket Not Found");
return;

}

localStorage.setItem(
"allTickets",
JSON.stringify(tickets)
);

alert("Ticket Booked");

renderTickets();

}

</script>

</body>
</html>
