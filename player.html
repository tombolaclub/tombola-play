<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tombola Player</title>

<style>

body{
margin:0;
padding:10px;
font-family:Arial,sans-serif;
background-image:url("background.jpg");
background-size:cover;
background-position:center;
}

.box{
background:rgba(255,255,255,.95);
padding:12px;
border-radius:15px;
margin-bottom:10px;
}

.banner img{
width:100%;
border-radius:15px;
}

.timebox{
display:flex;
gap:5px;
margin-top:10px;
}

.timeitem{
flex:1;
background:#001a66;
color:white;
border:3px solid yellow;
padding:10px;
border-radius:10px;
text-align:center;
font-weight:bold;
}

.btn{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
background:#1976d2;
color:white;
}

.bookBtn{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
background:#f44336;
color:white;
}

input{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

#ticketChart{
display:none;
grid-template-columns:repeat(10,1fr);
gap:4px;
margin-top:10px;
}

.number{
background:white;
padding:8px;
border-radius:6px;
border:1px solid #ccc;
text-align:center;
font-size:12px;
}

.booked{
background:yellow;
font-weight:bold;
}

.ticketCard{
background:white;
padding:10px;
border-radius:10px;
margin-top:8px;
}

.unsold{
color:red;
font-weight:bold;
}

#playerPage{
display:none;
}

</style>
</head>

<body>

<div id="announcementBox" class="box">

<h2 align="center">🎉 ANNOUNCEMENT 🎉</h2>

<p>✅ Tombola is a skill-based entertainment game.</p>
<p>✅ Check your ticket before game starts.</p>
<p>✅ Re-game may happen during technical issues.</p>
<p>✅ Purchased tickets stay valid.</p>
<p>✅ Follow fair play rules.</p>

<button
class="bookBtn"
onclick="acceptGame()">
I ACCEPT
</button>

</div>

<div id="playerPage">

<div class="box">

<div class="banner">
<img src="banner.png">
</div>

<div class="timebox">

<div class="timeitem" id="dateBox">
DATE
</div>

<div class="timeitem" id="countdown">
00:00:00
</div>

<div class="timeitem" id="timeBox">
TIME
</div>

</div>

<button
class="btn"
onclick="toggleTickets()">
AVAILABLE TICKETS
</button>

<div id="ticketChart"></div>

<div id="ticketList"></div>

<h3>🎫 Book Ticket</h3>

<input
type="number"
id="ticketNo"
placeholder="Enter Ticket Number">

<input
type="text"
id="playerName"
placeholder="Enter Your Name">

<button
class="bookBtn"
onclick="bookTicket()">
BOOK TICKET
</button>

</div>

</div>

<script>

function acceptGame(){

document.getElementById(
"announcementBox"
).style.display="none";

document.getElementById(
"playerPage"
).style.display="block";

}

function updateClock(){

let now=new Date();

document.getElementById(
"dateBox"
).innerHTML=
now.toLocaleDateString();

document.getElementById(
"timeBox"
).innerHTML=
now.toLocaleTimeString();

let gameTime=
localStorage.getItem(
"gameTime"
);

if(gameTime){

let diff=
new Date(gameTime)-
new Date();

if(diff>0){

let h=
Math.floor(diff/1000/60/60);

let m=
Math.floor((diff/1000/60)%60);

let s=
Math.floor((diff/1000)%60);

document.getElementById(
"countdown"
).innerHTML=
h+":"+m+":"+s;

}else{

document.getElementById(
"countdown"
).innerHTML=
"GAME START";

}

}

}

setInterval(updateClock,1000);

function renderTickets(){

let total=
parseInt(
localStorage.getItem(
"ticketCount"
)||0
);

let html="";

for(let i=1;i<=total;i++){

let owner=
localStorage.getItem(
"ticket_"+i
);

html+=`
<div class="ticketCard">

<b>Ticket ${i}</b><br>

${
owner
?owner
:'<span class="unsold">UNSOLD</span>'
}

</div>
`;

}

document.getElementById(
"ticketList"
).innerHTML=
html;

}

function toggleTickets(){

let box=
document.getElementById(
"ticketChart"
);

if(box.style.display==="grid"){

box.style.display="none";
return;

}

box.style.display="grid";

let total=
parseInt(
localStorage.getItem(
"ticketCount"
)||0
);

let html="";

for(let i=1;i<=total;i++){

let owner=
localStorage.getItem(
"ticket_"+i
);

html+=`
<div class="number ${owner?'booked':''}">
${i}
</div>
`;

}

box.innerHTML=html;

}

function bookTicket(){

let no=
document.getElementById(
"ticketNo"
).value;

let name=
document.getElementById(
"playerName"
).value;

if(!no || !name){

alert("Fill all fields");
return;

}

if(
localStorage.getItem(
"ticket_"+no
)
){

alert("Already Booked");
return;

}

localStorage.setItem(
"ticket_"+no,
name
);

alert(
"Ticket Booked Successfully"
);

renderTickets();

toggleTickets();
toggleTickets();

}

renderTickets();

</script>

</body>
</html>
