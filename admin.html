<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tombola Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
margin:0;
padding:15px;
font-family:Arial,sans-serif;
background-image:url("background.jpg");
background-size:cover;
background-position:center;
}

.panel{
background:rgba(255,255,255,.95);
padding:15px;
border-radius:15px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

.btn{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
}

.green{background:#4caf50;}
.blue{background:#1976d2;}
.red{background:#f44336;}

#result{
margin-top:15px;
padding:10px;
background:#f5f5f5;
border-radius:10px;
}
</style>
</head>

<body>

<div class="panel">

<h2>🎮 Tombola Admin Panel</h2>

<input id="gameTitle" placeholder="Game Title">

<input type="datetime-local" id="gameTime">

<button class="btn blue" onclick="createGame()">
CREATE GAME
</button>

<button class="btn green" onclick="generateTickets()">
GENERATE 600 TICKETS
</button>

<button class="btn red" onclick="deleteTickets()">
DELETE ALL TICKETS
</button>

<div id="result"></div>

</div>

<script>

const SUPABASE_URL =
"https://ddvkmudxeddfisyqevsz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Z8Wgn7MsuuCl2g1OOdix7g_-QzXOzrf";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentGameId="";

async function createGame(){

let title =
document.getElementById("gameTitle").value;

let dt =
document.getElementById("gameTime").value;

if(!title || !dt){

alert("Enter title and time");
return;

}

let d = new Date(dt);

const {data,error} =
await supabase
.from("games")
.insert([{
title:title,
game_date:d.toISOString().split("T")[0],
game_time:d.toTimeString().slice(0,8),
status:"upcoming"
}])
.select();

if(error){

alert(error.message);
return;

}

currentGameId=data[0].id;

localStorage.setItem(
"currentGameId",
currentGameId
);

document.getElementById("result").innerHTML=
"✅ Game Created";

}

function createTicket(){

return [

["",12,"",45,"",61,"",89,""],
[14,"",33,"",58,"",71,80,""],
[5,"",21,"",49,"",66,75,""]

];

}

async function generateTickets(){

let gameId =
localStorage.getItem("currentGameId");

if(!gameId){

alert("Create Game First");
return;

}

let rows=[];

for(let i=1;i<=600;i++){

rows.push({

game_id:gameId,
ticket_numbers:createTicket(),
status:"available"

});

}

const {error} =
await supabase
.from("tickets")
.insert(rows);

if(error){

alert(error.message);
return;

}

document.getElementById("result").innerHTML=
"✅ 600 Tickets Generated";

alert("600 Tickets Generated");

}

async function deleteTickets(){

if(!confirm("Delete all tickets?"))
return;

const {error} =
await supabase
.from("tickets")
.delete()
.neq("id","0");

if(error){

alert(error.message);
return;

}

document.getElementById("result").innerHTML=
"❌ Tickets Deleted";

}

</script>

</body>
</html>
