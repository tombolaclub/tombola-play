<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tombola Admin</title>

<style>
body{
font-family:Arial;
background:url("background.jpg");
background-size:cover;
padding:15px;
}

.box{
background:white;
padding:20px;
border-radius:15px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:18px;
color:white;
}

.blue{background:#1976d2;}
.green{background:#4caf50;}
.orange{background:#ff9800;}
.red{background:#f44336;}

#result{
margin-top:20px;
background:#f5f5f5;
padding:10px;
border-radius:10px;
}
</style>
</head>

<body>

<div class="box">

<h2 align="center">🎮 Tombola Admin Panel</h2>

<input type="text" id="title" placeholder="Game Title">

<input type="datetime-local" id="time">

<button class="blue" onclick="generateTickets()">
Generate Tickets
</button>

<button class="green" onclick="generateGame()">
Generate Game
</button>

<button class="orange" onclick="changeTime()">
Re-Generate Time
</button>

<button class="red" onclick="cancelGame()">
Cancel Game
</button>

<div id="result"></div>

</div>

<script>

function generateTickets(){

let count=prompt("How many tickets?");

if(count){

localStorage.setItem("tickets",count);

document.getElementById("result").innerHTML=
"✅ "+count+" Tickets Generated";

alert(count+" Tickets Generated");

}

}

function generateGame(){

let title=document.getElementById("title").value;

let time=document.getElementById("time").value;

localStorage.setItem("gameTitle",title);

localStorage.setItem("gameTime",time);

document.getElementById("result").innerHTML=
"🎉 Game Created<br><br>Title: "+title+
"<br>Time: "+time;

alert("Game Generated Successfully");

}

function changeTime(){

let newtime=prompt("Enter New Time");

if(newtime){

localStorage.setItem("gameTime",newtime);

alert("New Time Saved");

}

}

function cancelGame(){

localStorage.clear();

document.getElementById("result").innerHTML=
"❌ Game Cancelled";

alert("Game Cancelled");

}

</script>

</body>
</html>
