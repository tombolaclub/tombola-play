<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TombolaPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white;
}

header{
  background:#121a30;
  padding:15px;
  text-align:center;
  font-size:26px;
  font-weight:bold;
}

header span{
  color:#fbbf24;
}

.page{
  display:none;
  padding:20px;
}

.page.active{
  display:block;
}

.card{
  max-width:800px;
  margin:15px auto;
  padding:20px;
  background:#18233f;
  border-radius:18px;
}

.center{
  text-align:center;
}

h1,h2,h3{
  margin-bottom:15px;
}

button{
  border:0;
  padding:13px 18px;
  border-radius:10px;
  margin:5px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.green{
  background:#22c55e;
  color:white;
}

.orange{
  background:#f59e0b;
  color:#111;
}

.red{
  background:#ef4444;
  color:white;
}

.blue{
  background:#3b82f6;
  color:white;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0 15px;
  border-radius:8px;
  border:1px solid #475569;
  background:#0b1020;
  color:white;
  font-size:16px;
}

.current-number{
  width:150px;
  height:150px;
  margin:20px auto;
  border-radius:50%;
  background:#fbbf24;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
  font-weight:bold;
  box-shadow:0 0 30px #fbbf24;
}

.number-board{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:5px;
  margin-top:20px;
}

.number{
  background:#24314f;
  padding:10px 2px;
  text-align:center;
  border-radius:6px;
}

.called{
  background:#22c55e;
  color:white;
}

.ticket{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  gap:3px;
  background:#64748b;
  padding:5px;
  border-radius:8px;
  margin:20px auto;
}

.cell{
  min-height:40px;
  background:white;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  border-radius:3px;
}

.empty{
  background:#cbd5e1;
}

.marked{
  background:#22c55e !important;
  color:white;
}

.status{
  padding:10px;
  border-radius:8px;
  margin:10px 0;
  text-align:center;
  background:#24314f;
}

.hidden{
  display:none;
}

@media(max-width:600px){

.number-board{
  grid-template-columns:repeat(10,1fr);
}

.number{
  font-size:12px;
  padding:8px 1px;
}

.current-number{
  width:120px;
  height:120px;
  font-size:55px;
}

}
</style>
</head>

<body>

<header>
🎰 Tombola<span>Play</span>
</header>


<!-- HOME -->

<section id="home" class="page active">

<div class="card center">

<h1>Play Tombola. Win Big! 🎉</h1>

<p>Book your ticket and join the live game.</p>

<button class="green"
onclick="showPage('booking')">

🎟️ BOOK TICKET

</button>

<button class="orange"
onclick="showPage('live')">

🔴 JOIN LIVE GAME

</button>

<button class="blue"
onclick="showPage('admin')">

👨‍💼 HOST PANEL

</button>

</div>

</section>


<!-- BOOKING -->

<section id="booking" class="page">

<div class="card">

<button onclick="showPage('home')">
⬅ Back
</button>

<h2 class="center">🎟️ Book Your Ticket</h2>

<div id="ticketArea"></div>

<div class="center">

<button class="orange"
onclick="generateTicket()">

🎲 Generate Ticket

</button>

</div>

<label>Name</label>

<input
id="playerName"
placeholder="Enter your name">

<label>WhatsApp Number</label>

<input
id="playerPhone"
placeholder="Enter WhatsApp number">

<button
class="green"
style="width:100%"
onclick="bookOnWhatsApp()">

💬 BOOK ON WHATSAPP

</button>

</div>

</section>


<!-- LIVE GAME -->

<section id="live" class="page">

<div class="card center">

<button onclick="showPage('home')">
⬅ Back
</button>

<h2>🔴 LIVE TOMBOLA GAME</h2>

<div class="status" id="gameStatus">
Waiting for host...
</div>

<div class="current-number" id="currentNumber">
--
</div>

<h3>Latest Number</h3>

</div>


<div class="card">

<h3 class="center">🔢 Called Numbers</h3>

<div class="number-board" id="numberBoard"></div>

</div>


<div class="card">

<h3 class="center">🏆 Winners</h3>

<div id="winnerList">

Quick 7: Waiting...<br><br>

Full House: Waiting...

</div>

</div>

</section>


<!-- ADMIN -->

<section id="admin" class="page">

<div class="card">

<button onclick="showPage('home')">
⬅ Back
</button>

<h2 class="center">👨‍💼 HOST CONTROL PANEL</h2>

<label>Game Date</label>

<input type="date" id="gameDate">

<label>Game Time</label>

<input type="time" id="gameTime">

<label>Number Interval (Seconds)</label>

<input
type="number"
id="drawInterval"
value="5"
min="3">

<div class="center">

<button
class="blue"
onclick="createGame()">

📅 CREATE GAME

</button>

</div>

</div>


<div class="card center">

<h3>Game Controls</h3>

<button
class="green"
onclick="startGame()">

▶ START GAME

</button>

<button
class="orange"
onclick="pauseGame()">

⏸ PAUSE

</button>

<button
class="blue"
onclick="resumeGame()">

▶ RESUME

</button>

<button
class="red"
onclick="finishGame()">

⏹ FINISH

</button>

</div>


<div class="card center">

<h3>Current Number</h3>

<div class="current-number" id="adminNumber">
--
</div>

</div>

</section>


<script>

/* =====================================
   SUPABASE SETTINGS
   PASTE YOUR DETAILS BELOW
===================================== */

const SUPABASE_URL =
"PASTE_YOUR_PROJECT_URL_HERE";

const SUPABASE_KEY =
"PASTE_YOUR_PUBLISHABLE_OR_ANON_KEY_HERE";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================
   SETTINGS
===================================== */

const whatsappNumber =
"919101151835";

let ticketNumbers = [];

let currentGameId = null;

let calledNumbers = [];

let gameTimer = null;


/* =====================================
   PAGE
===================================== */

function showPage(page){

document.querySelectorAll(".page")
.forEach(function(item){

item.classList.remove("active");

});

document.getElementById(page)
.classList.add("active");

if(page==="live"){
loadLiveGame();
}

}


/* =====================================
   GENERATE TICKET
===================================== */

function generateTicket(){

ticketNumbers=[];

while(ticketNumbers.length<15){

let n =
Math.floor(Math.random()*90)+1;

if(!ticketNumbers.includes(n)){

ticketNumbers.push(n);

}

}

ticketNumbers.sort(function(a,b){
return a-b;
});

let area =
document.getElementById("ticketArea");

area.innerHTML="";

let ticket =
document.createElement("div");

ticket.className="ticket";

for(let i=0;i<27;i++){

let cell =
document.createElement("div");

if(i<15){

cell.className="cell";

cell.innerText=ticketNumbers[i];

}else{

cell.className="cell empty";

}

ticket.appendChild(cell);

}

area.appendChild(ticket);

}


/* =====================================
   WHATSAPP BOOKING
===================================== */

function bookOnWhatsApp(){

let name =
document.getElementById("playerName")
.value.trim();

let phone =
document.getElementById("playerPhone")
.value.trim();


if(!name || !phone){

alert("Please enter name and WhatsApp number.");

return;

}


if(ticketNumbers.length===0){

alert("Please generate a ticket.");

return;

}


let text =
"🎰 *TOMBOLAPLAY BOOKING*%0A%0A"+
"👤 Name: "+encodeURIComponent(name)+"%0A"+
"📱 WhatsApp: "+encodeURIComponent(phone)+"%0A"+
"🎟️ Numbers: "+
encodeURIComponent(ticketNumbers.join(", "))+
"%0A%0A"+
"Status: Booking Request";


window.open(

"https://wa.me/"+
whatsappNumber+
"?text="+
text,

"_blank"

);

}


/* =====================================
   CREATE GAME
===================================== */

async function createGame(){

let date =
document.getElementById("gameDate").value;

let time =
document.getElementById("gameTime").value;

let interval =
document.getElementById("drawInterval").value;


if(!date || !time){

alert("Please select game date and time.");

return;

}


let result =
await supabaseClient
.from("games")
.insert({

title:"TombolaPlay Bumper",

game_date:date,

game_time:time,

draw_interval:parseInt(interval),

status:"upcoming"

})
.select();


if(result.error){

alert(result.error.message);

return;

}


currentGameId =
result.data[0].id;

alert("Game created successfully!");

}


/* =====================================
   START GAME
===================================== */

async function startGame(){

if(!currentGameId){

let result =
await supabaseClient
.from("games")
.select("*")
.order("created_at",
{ascending:false})
.limit(1);


if(result.data &&
result.data.length>0){

currentGameId =
result.data[0].id;

}else{

alert("Please create a game first.");

return;

}

}


calledNumbers=[];


await supabaseClient
.from("games")
.update({

status:"live",

called_numbers:[],

current_number:null

})
.eq("id",currentGameId);


document.getElementById(
"gameStatus"
).innerText=
"🔴 LIVE GAME RUNNING";


let interval =
document.getElementById(
"drawInterval"
).value;


drawNumber();


gameTimer =
setInterval(

drawNumber,

parseInt(interval)*1000

);

}


/* =====================================
   DRAW NUMBER
===================================== */

async function drawNumber(){

if(calledNumbers.length>=90){

finishGame();

return;

}


let number;


do{

number =
Math.floor(Math.random()*90)+1;

}

while(calledNumbers.includes(number));


calledNumbers.push(number);


document.getElementById(
"adminNumber"
).innerText=number;


speakNumber(number);


await supabaseClient
.from("games")
.update({

current_number:number,

called_numbers:calledNumbers,

status:"live"

})
.eq("id",currentGameId);


updateBoard(calledNumbers);

}


/* =====================================
   SPEAK NUMBER
===================================== */

function speakNumber(number){

window.speechSynthesis.cancel();

let speech =
new SpeechSynthesisUtterance(
"Number " + number
);

speech.lang="en-IN";

speech.rate=0.8;

window.speechSynthesis.speak(speech);

}


/* =====================================
   PAUSE
===================================== */

async function pauseGame(){

clearInterval(gameTimer);


await supabaseClient
.from("games")
.update({

status:"paused"

})
.eq("id",currentGameId);


}


/* =====================================
   RESUME
===================================== */

async function resumeGame(){

let interval =
document.getElementById(
"drawInterval"
).value;


await supabaseClient
.from("games")
.update({

status:"live"

})
.eq("id",currentGameId);


gameTimer =
setInterval(

drawNumber,

parseInt(interval)*1000

);

}


/* =====================================
   FINISH
===================================== */

async function finishGame(){

clearInterval(gameTimer);


await supabaseClient
.from("games")
.update({

status:"finished"

})
.eq("id",currentGameId);


alert("Game Finished!");

}


/* =====================================
   LIVE GAME LOAD
===================================== */

async function loadLiveGame(){

let result =
await supabaseClient
.from("games")
.select("*")
.order("created_at",
{ascending:false})
.limit(1);


if(!result.data ||
result.data.length===0){

return;

}


let game =
result.data[0];


currentGameId =
game.id;


document.getElementById(
"gameStatus"
).innerText =
game.status.toUpperCase();


document.getElementById(
"currentNumber"
).innerText =
game.current_number || "--";


calledNumbers =
game.called_numbers || [];


updateBoard(calledNumbers);

}


/* =====================================
   NUMBER BOARD
===================================== */

function updateBoard(numbers){

let board =
document.getElementById(
"numberBoard"
);

board.innerHTML="";


for(let i=1;i<=90;i++){

let box =
document.createElement("div");

box.className="number";

box.innerText=i;


if(numbers.includes(i)){

box.classList.add("called");

}


board.appendChild(box);

}

}


/* =====================================
   REALTIME
===================================== */

supabaseClient
.channel("games-live")
.on(

"postgres_changes",

{

event:"UPDATE",

schema:"public",

table:"games"

},

function(payload){

let game =
payload.new;


document.getElementById(
"currentNumber"
).innerText =
game.current_number || "--";


document.getElementById(
"gameStatus"
).innerText =
game.status.toUpperCase();


calledNumbers =
game.called_numbers || [];


updateBoard(calledNumbers);


if(game.current_number){

speakNumber(
game.current_number
);

}

}

)
.subscribe();


/* INITIAL */

updateBoard([]);

</script>

</body>
</html>
