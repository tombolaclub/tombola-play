<style>

*{
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;
background:#101522;

header{

padding:16px;

}

.page{

padding:18px;
min-height:calc(100vh - 60px);
}

.active{
display:block;
}

.card{

margin:15px auto;
background:#1c263d;
padding:20px;
border-radius:18px;
box-shadow:0 5px 20px #0008;
}

h1,h2,h3{
text-align:center;
}

button{
width:100%;
padding:15px;
margin:7px 0;
border:0;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
background:#ffca28;
color:#111;
}

.green{
background:#43a047;
color:white;
}

.red{
background:#e53935;
color:white;
}

.blue{
background:#2196f3;
color:white;
}

input{
width:100%;
padding:13px;
margin:6px 0;
border:0;
border-radius:10px;
font-size:16px;
}

.status{
background:#263653;
padding:12px;
border-radius:10px;
text-align:center;
margin-bottom:10px;
}

.big{
font-size:100px;
font-weight:bold;
text-align:center;
color:#ffca28;
margin:10px;
}

.board{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:5px;
}

.num{
padding:9px 2px;
text-align:center;
background:#34415d;
border-radius:6px;
}

.num.called{
background:#ffca28;
color:#111;
font-weight:bold;
}

.previous{
display:flex;
flex-wrap:wrap;
gap:6px;
}

.previous span{
background:#40516f;
padding:8px 12px;
border-radius:20px;
}

.ticketNumber{
background:#ffca28;
color:#111;
font-size:22px;
font-weight:bold;
padding:12px;
border-radius:12px;
text-align:center;
margin:10px 0;
}

.ticket{
display:grid;
grid-template-columns:repeat(9,1fr);
gap:3px;
background:white;
padding:5px;
border-radius:10px;
margin:10px auto;
max-width:500px;
}

.cell{
height:48px;
display:flex;
align-items:center;
justify-content:center;
background:#eee;
color:#111;
font-weight:bold;
font-size:18px;
border-radius:4px;
}

.empty{
background:#ccc;
}

.marked{
background:#43a047!important;
color:white!important;
}

.winner{
background:#43a047;
padding:13px;
margin:6px 0;
border-radius:10px;
text-align:center;
font-weight:bold;
}

.player{
background:#263653;
padding:10px;
border-radius:8px;
margin:5px 0;
}

.small{
font-size:13px;
opacity:.8;
}

.info{
background:#263653;
padding:12px;
border-radius:10px;
margin:10px 0;
text-align:center;
}

.ticketNumbers{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin:15px 0;
}

.ticketBtn{
padding:14px 5px;
margin:0;
border-radius:8px;
background:#43a047;
color:white;
font-size:17px;
}

.ticketBtn.booked{
background:#e53935;
color:white;
opacity:.85;
cursor:not-allowed;
}

.ticketBtn.selected{
background:#ffca28;
color:#111;
border:3px solid white;
}

</style>
</head>

<body>

<script>

/* =====================================
SUPABASE
===================================== */

const SUPABASE_URL =
"https://ddvkmudxeddfisyqevsz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Z8Wgn7MsuuCl2g1OOdix7g_-QzXOzrf";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================
VARIABLES
===================================== */

let currentGame = null;

let myPlayer = null;

let myTicket = [];

let myTicketNumber = null;

let selectedTicketNumber = null;

let autoTimer = null;

let lastNumber = null;


/* =====================================
PAGE
===================================== */

function showPage(id){

document
.querySelectorAll(".page")
.forEach(p => {

p.classList.remove("active");

});

document
.getElementById(id)
.classList.add("active");


if(id === "gamePage"){

loadGame();

}


if(id === "ticketPage"){

selectedTicketNumber = null;

document
.getElementById(
"selectedTicketText"
)
.innerText = "None";

showTicketNumbers();

}

}


/* =====================================
NUMBER BOARD
===================================== */

const board =
document.getElementById(
"numberBoard"
);

for(let i=1;i<=90;i++){

const d =
document.createElement("div");

d.className = "num";

d.id = "num-" + i;

d.innerText = i;

board.appendChild(d);

}


/* =====================================
TICKET GENERATOR
===================================== */

function generateTicket(){

let ticket = [];

for(let r=0;r<3;r++){

let row =
new Array(9).fill(null);

let positions = [];

while(positions.length < 5){

let p =
Math.floor(
Math.random()*9
);

if(
!positions.includes(p)
){

positions.push(p);

}

}

positions.sort(
(a,b)=>a-b
);

for(
const col of positions
){

let min;
let max;

if(col === 0){

min = 1;
max = 9;

}
else if(col === 8){

min = 80;
max = 90;

}
else{

min = col * 10;
max = col * 10 + 9;

}

let n;

do{

n =
Math.floor(
Math.random() *
(max-min+1)
) + min;

}
while(
row.includes(n)
);

row[col] = n;

}

ticket.push(row);

}

return ticket;

}


/* =====================================
LOAD GAME
===================================== */

async function loadGame(){

const {data,error} =
await db
.from("games")
.select("*")
.order(
"id",
{
ascending:false
}
)
.limit(1)
.maybeSingle();

if(error){

console.log(error);

return;

}

if(data){

currentGame = data;

updateGameScreen(
data
);

}

}


/* =====================================
GET USED TICKET NUMBERS
===================================== */

async function getUsedTicketNumbers(){

if(!currentGame){

await loadGame();

}

if(!currentGame){

return [];

}

const {data,error} =
await db
.from("players")
.select("ticket")
.eq(
"game_id",
currentGame.id
);

if(error){

console.log(error);

return [];

}

let used = [];

(data || []).forEach(player => {

try{

let t =
player.ticket;

if(
typeof t === "string"
){

t = JSON.parse(t);

}

if(
t &&
t.ticket_number
){

used.push(
Number(
t.ticket_number
)
);

}

}
catch(e){

console.log(e);

}

});

return used;

}


/* =====================================
SHOW 1 TO 50 TICKETS
===================================== */

async function showTicketNumbers(){

await loadGame();

const area =
document.getElementById(
"ticketNumbers"
);

if(!currentGame){

area.innerHTML =
"Game not available yet";

return;

}

const used =
await getUsedTicketNumbers();


const bookedEl =
document.getElementById(
"bookedTickets"
);

const availableEl =
document.getElementById(
"availableTickets"
);


if(bookedEl){

bookedEl.innerText =
used.length;

}


if(availableEl){

availableEl.innerText =
50 - used.length;

}


area.innerHTML = "";


for(let i=1;i<=50;i++){

const btn =
document.createElement("button");

btn.innerText = i;

btn.className =
"ticketBtn";


if(
used.includes(i)
){

btn.classList.add(
"booked"
);

btn.disabled = true;

}
else{

btn.onclick = function(){

selectedTicketNumber = i;


document
.querySelectorAll(
".ticketBtn"
)
.forEach(b => {

b.classList.remove(
"selected"
);

});


btn.classList.add(
"selected"
);


document
.getElementById(
"selectedTicketText"
)
.innerText = i;

};

}


area.appendChild(btn);

}

}


/* =====================================
RENDER TICKET
===================================== */

function renderTicket(
ticket,
id,
ticketNumber=null
){

const area =
document.getElementById(id);

area.innerHTML = "";


if(ticketNumber){

const numberBox =
document.createElement("div");

numberBox.className =
"ticketNumber";

numberBox.innerText =
"🎟️ TICKET NO. " +
ticketNumber;

area.appendChild(
numberBox
);

}


const box =
document.createElement("div");

box.className =
"ticket";


ticket.forEach(row => {

row.forEach(n => {

const cell =
document.createElement("div");

cell.className =
"cell";


if(n === null){

cell.classList.add(
"empty"
);

}
else{

cell.innerText = n;

cell.dataset.number = n;

}


box.appendChild(cell);

});

});


area.appendChild(box);

}


/* =====================================
GENERATE PLAYER TICKET
===================================== */

async function generatePlayer(){

const name =
document
.getElementById(
"playerName"
)
.value
.trim();


if(!name){

alert(
"Name enter karo"
);

return;

}


await loadGame();


if(!currentGame){

alert(
"Admin ne abhi game create nahi kiya."
);

return;

}


if(
!selectedTicketNumber
){

alert(
"Pehle 1 se 50 ke andar koi Ticket Number select karo"
);

return;

}


const used =
await getUsedTicketNumbers();


if(
used.includes(
selectedTicketNumber
)
){

alert(
"Ye ticket already booked hai. Dusra ticket select karo."
);

showTicketNumbers();

return;

}


myTicket =
generateTicket();

myTicketNumber =
selectedTicketNumber;


renderTicket(
myTicket,
"ticketPreview",
myTicketNumber
);


alert(
"Ticket No. " +
myTicketNumber +
" generated!"
);

}


/* =====================================
CREATE NEW GAME
===================================== */

async function createNewGame(){

const title =
document
.getElementById(
"gameTitle"
)
.value ||
"GRS Tambola";


let gameDate =
document
.getElementById(
"gameDate"
)
.value;


let gameTime =
document
.getElementById(
"gameTime"
)
.value;


/* Default date */

if(!gameDate){

const now =
new Date();

gameDate =
now.getFullYear() +
"-" +
String(
now.getMonth()+1
).padStart(2,"0") +
"-" +
String(
now.getDate()
).padStart(2,"0");

}


/* Default time */

if(!gameTime){

const now =
new Date();

gameTime =
String(
now.getHours()
).padStart(2,"0") +
":" +
String(
now.getMinutes()
).padStart(2,"0");

}


const quick =
document
.getElementById(
"quickPrize"
)
.value;


const top =
document
.getElementById(
"topPrize"
)
.value;


const middle =
document
.getElementById(
"middlePrize"
)
.value;


const bottom =
document
.getElementById(
"bottomPrize"
)
.value;


const full =
document
.getElementById(
"fullPrize"
)
.value;


/* Stop old games */

await db
.from("games")
.update({
status:"stopped"
})
.eq(
"status",
"live"
);


/* Create new game */

const {data,error} =
await db
.from("games")
.insert({

title:title,

game_date:gameDate,

game_time:gameTime,

status:"waiting",

current_number:null,

called_numbers:[]

})
.select()
.single();


if(error){

alert(
"Game create error: " +
error.message
);

return;

}


currentGame = data;


/* Save prizes */

localStorage.setItem(
"prizes",
JSON.stringify({

quick5:quick,

top:top,

middle:middle,

bottom:bottom,

full:full

})
);


alert(
"New game created! Players can now select tickets 1 to 50."
);

}


/* =====================================
START GAME
===================================== */

async function startGame(){

if(!currentGame){

await loadGame();

}


if(!currentGame){

alert(
"Pehle New Game create karo"
);

return;

}


const {data,error} =
await db
.from("games")
.update({

status:"live"

})
.eq(
"id",
currentGame.id
)
.select()
.single();


if(error){

alert(
error.message
);

return;

}


currentGame = data;

updateGameScreen(data);

}


/* =====================================
STOP GAME
===================================== */

async function stopGame(){

if(!currentGame){

return;

}


const {data,error} =
await db
.from("games")
.update({

status:"stopped"

})
.eq(
"id",
currentGame.id
)
.select()
.single();


if(error){

alert(error.message);

return;

}


currentGame = data;

updateGameScreen(data);

stopAutoDraw();

}


/* =====================================
DRAW NUMBER
===================================== */

async function drawNumber(){

if(!currentGame){

await loadGame();

}


if(!currentGame){

alert(
"Game nahi mila"
);

return;

}


if(
currentGame.status !== "live"
){

alert(
"Game START nahi hai"
);

return;

}


let called =
currentGame.called_numbers || [];


if(called.length >= 90){

alert(
"All 90 numbers complete!"
);

return;

}


let number;

do{

number =
Math.floor(
Math.random()*90
)+1;

}
while(
called.includes(number)
);


called.push(number);


const {data,error} =
await db
.from("games")
.update({

current_number:number,

called_numbers:called

})
.eq(
"id",
currentGame.id
)
.select()
.single();


if(error){

alert(
"Draw error: " +
error.message
);

return;

}


currentGame = data;

updateGameScreen(data);

}


/* =====================================
AUTO DRAW
===================================== */

function autoDraw(){

stopAutoDraw();

drawNumber();

autoTimer =
setInterval(
drawNumber,
10000
);

}


function stopAutoDraw(){

if(autoTimer){

clearInterval(
autoTimer
);

autoTimer = null;

}

}


/* =====================================
VOICE
===================================== */

function speakNumber(n){

if(!n){

return;

}


if(!window.speechSynthesis){

return;

}


const speech =
new SpeechSynthesisUtterance(
"Number " + n
);

speech.rate = .85;

speechSynthesis.cancel();

speechSynthesis.speak(
speech
);

}


/* =====================================
UPDATE GAME SCREEN
===================================== */

function updateGameScreen(game){

if(!game){

return;

}


document
.getElementById(
"gameStatus"
)
.innerText =

game.status === "live"
?
"🟢 GAME LIVE"
:
game.status === "stopped"
?
"🔴 GAME STOPPED"
:
"🟡 GAME WAITING";


document
.getElementById(
"currentNumber"
)
.innerText =
game.current_number || "-";


document
.querySelectorAll(".num")
.forEach(n => {

n.classList.remove(
"called"
);

});


const called =
game.called_numbers || [];


called.forEach(n => {

const el =
document.getElementById(
"num-" + n
);

if(el){

el.classList.add(
"called"
);

}

});


const previous =
document.getElementById(
"previousNumbers"
);

previous.innerHTML = "";


called
.slice()
.reverse()
.forEach(n => {

const span =
document.createElement(
"span"
);

span.innerText = n;

previous.appendChild(
span
);

});


if(
game.current_number &&
game.current_number !== lastNumber
){

lastNumber =
game.current_number;

speakNumber(
game.current_number
);

}


updateMyTicket(
called
);

loadWinners(
game.id
);

}


/* =====================================
MARK MY TICKET
===================================== */

function updateMyTicket(called){

document
.querySelectorAll(
"#gameTicket .cell[data-number]"
)
.forEach(cell => {

const n =
Number(
cell.dataset.number
);


if(
called.includes(n)
){

cell.classList.add(
"marked"
);

}
else{

cell.classList.remove(
"marked"
);

}

});


checkWinners();

}


/* =====================================
JOIN GAME
===================================== */

async function joinGame(){

const name =
document
.getElementById(
"playerName"
)
.value
.trim();


const phone =
document
.getElementById(
"playerPhone"
)
.value
.trim();


if(!name){

alert(
"Name enter karo"
);

return;

}


if(
!myTicket.length
){

alert(
"Pehle ticket generate karo"
);

return;

}


if(
!myTicketNumber
){

alert(
"Pehle ticket generate karo"
);

return;

}


await loadGame();


if(!currentGame){

alert(
"Game available nahi hai"
);

return;

}


/* Double check */

const used =
await getUsedTicketNumbers();


if(
used.includes(
myTicketNumber
)
){

alert(
"Ye ticket number already booked hai. Dusra ticket select karo."
);

myTicket = [];

myTicketNumber = null;

selectedTicketNumber = null;

document
.getElementById(
"ticketPreview"
)
.innerHTML = "";

showTicketNumbers();

return;

}


const ticketData = {

ticket_number:
myTicketNumber,

grid:
myTicket

};


const {data,error} =
await db
.from("players")
.insert({

name:name,

phone:phone,

game_id:
currentGame.id,

ticket:
ticketData

})
.select()
.single();


if(error){

alert(
"Player error: " +
error.message
);

return;

}


myPlayer = data;


/* Save local */

localStorage.setItem(
"player_id",
data.id
);

localStorage.setItem(
"player_name",
name
);

localStorage.setItem(
"ticket_number",
myTicketNumber
);


/* Show game ticket */

renderTicket(
myTicket,
"gameTicket",
myTicketNumber
);


showPage(
"gamePage"
);

}


/* =====================================
CHECK WINNERS
===================================== */

async function checkWinners(){

if(
!myPlayer ||
!myTicket.length ||
!currentGame
){

return;

}


const called =
currentGame.called_numbers || [];


let all = [];


myTicket.forEach(row => {

row.forEach(n => {

if(n !== null){

all.push(n);

}

});

});


const marked =
all.filter(
n => called.includes(n)
);


/* QUICK 5 */

if(marked.length >= 5){

await claimWinner(
"Quick 5"
);

}


/* TOP */

if(
checkRow(
myTicket[0],
called
)
){

await claimWinner(
"Top Line"
);

}


/* MIDDLE */

if(
checkRow(
myTicket[1],
called
)
){

await claimWinner(
"Middle Line"
);

}


/* BOTTOM */

if(
checkRow(
myTicket[2],
called
)
){

await claimWinner(
"Bottom Line"
);

}

function checkRow(
row,
called
){

return row
.filter(
n => n !== null
)
.every(
n => called.includes(n)
);

}


/* =====================================
CLAIM WINNER
===================================== */

async function claimWinner(type){

if(
!myPlayer ||
!currentGame
){

return;

}


const {data} =
await db
.from("winners")
.select("id")
.eq(
"game_id",
currentGame.id
)
.eq(
"ticket_id",
myPlayer.id
)
.eq(
"prize_type",
type
)
.limit(1);
