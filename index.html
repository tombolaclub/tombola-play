<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TombolaPlay</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0b1020;color:white}
header{padding:16px 20px;background:#121a30;text-align:center}
.logo{font-size:26px;font-weight:bold}
.logo span{color:#fbbf24}
.page{display:none}
.page.active{display:block}
.hero{text-align:center;padding:50px 20px;background:radial-gradient(circle at top,#263c77,#0b1020 65%)}
.badge{display:inline-block;background:#f59e0b;color:#111;padding:8px 15px;border-radius:25px;font-weight:bold}
.hero h1{font-size:38px;margin:18px 0 10px}
.hero p{color:#cbd5e1}
.card{max-width:750px;margin:25px auto;padding:25px;background:#18233f;border-radius:20px}
.game-card{text-align:center}
.countdown{display:flex;justify-content:center;gap:8px;margin:20px 0}
.time-box{background:#0b1020;padding:12px;min-width:60px;border-radius:10px}
.time-box strong{display:block;font-size:24px;color:#fbbf24}
.time-box small{color:#94a3b8}
.btn{border:0;padding:14px 20px;border-radius:10px;margin:5px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{background:#22c55e;color:white}
.secondary{background:#f59e0b;color:#111}
.back{background:#475569;color:white}
input{width:100%;padding:13px;margin:7px 0 15px;border-radius:8px;border:1px solid #475569;background:#0b1020;color:white;font-size:16px}
.ticket{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;background:#64748b;padding:5px;border-radius:8px;margin:20px auto;max-width:600px}
.cell{height:45px;background:white;color:#111;display:flex;align-items:center;justify-content:center;font-weight:bold;border-radius:3px}
.empty{background:#cbd5e1}
.ticket-box{border:3px solid transparent;cursor:pointer}
.ticket-box.selected{border-color:#22c55e}
.message{text-align:center;background:#22c55e;padding:15px;border-radius:10px;display:none;margin-top:15px}
.message.show{display:block}
footer{text-align:center;padding:25px;color:#94a3b8}
@media(max-width:600px){
.hero h1{font-size:30px}
.cell{height:35px;font-size:13px}
.time-box{min-width:55px;padding:9px 5px}
}
</style>
</head>

<body>

<header>
<div class="logo">🎰 Tombola<span>Play</span></div>
</header>

<!-- HOME PAGE -->
<section id="home" class="page active">

<div class="hero">

<div class="badge">🔥 NEXT BUMPER GAME</div>

<h1>Play Tombola. Win Big. 🎉</h1>

<p>Book your ticket and join the next exciting game.</p>

<div class="card game-card">

<h2>🏆 TombolaPlay Bumper</h2>

<p id="gameDateText">Loading...</p>

<div class="countdown">

<div class="time-box">
<strong id="days">00</strong>
<small>Days</small>
</div>

<div class="time-box">
<strong id="hours">00</strong>
<small>Hours</small>
</div>

<div class="time-box">
<strong id="minutes">00</strong>
<small>Minutes</small>
</div>

<div class="time-box">
<strong id="seconds">00</strong>
<small>Seconds</small>
</div>

</div>

<button class="btn primary" onclick="showPage('booking')">
🎟️ BOOK YOUR TICKET
</button>

</div>

</div>

</section>


<!-- BOOKING PAGE -->
<section id="booking" class="page">

<div class="card">

<button class="btn back" onclick="showPage('home')">
⬅️ Back
</button>

<h2 style="text-align:center;margin:15px">
🎟️ Book Your Tombola Ticket
</h2>

<p style="text-align:center;color:#cbd5e1">
Generate a ticket and select it.
</p>

<div id="ticketArea"></div>

<div style="text-align:center">

<button class="btn secondary" onclick="generateTicket()">
🎲 Generate New Ticket
</button>

</div>

<label>Your Name</label>
<input type="text" id="playerName" placeholder="Enter your name">

<label>Phone Number</label>
<input type="tel" id="playerPhone" placeholder="Enter phone number">

<button class="btn primary" style="width:100%" onclick="bookTicket()">
✅ BOOK TICKET
</button>

<div class="message" id="message"></div>

</div>

</section>


<footer>
© 2026 TombolaPlay • Play Responsibly
</footer>


<script>

let ticketNumbers=[];


/* PAGE */

function showPage(page){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document.getElementById(page)
.classList.add("active");

if(page==="booking" && ticketNumbers.length===0){
generateTicket();
}

}


/* TICKET */

function generateTicket(){

ticketNumbers=[];

while(ticketNumbers.length<15){

let n=Math.floor(Math.random()*90)+1;

if(!ticketNumbers.includes(n)){
ticketNumbers.push(n);
}

}

ticketNumbers.sort((a,b)=>a-b);

let area=document.getElementById("ticketArea");

area.innerHTML="";

let ticket=document.createElement("div");

ticket.className="ticket ticket-box selected";

for(let i=0;i<27;i++){

let cell=document.createElement("div");

if(i<15){

cell.className="cell";

cell.innerText=ticketNumbers[i];

}else{

cell.className="cell empty";

}

ticket.appendChild(cell);

}

area.appendChild(ticket);

}


/* BOOK */

function bookTicket(){

let name=document.getElementById("playerName").value.trim();

let phone=document.getElementById("playerPhone").value.trim();

let message=document.getElementById("message");

if(!name || !phone){

alert("Please enter your name and phone number.");

return;

}

message.innerHTML=
"🎉 <b>Ticket Booked Successfully!</b><br><br>"+
"Player: "+name+"<br>"+
"Ticket Numbers: "+ticketNumbers.join(", ");

message.classList.add("show");

}


/* COUNTDOWN */

const gameDate=new Date(
new Date().getTime()+24*60*60*1000
);

document.getElementById("gameDateText").innerText=
gameDate.toLocaleString("en-IN");


function updateCountdown(){

let now=new Date().getTime();

let distance=gameDate-now;

if(distance<=0)return;

let d=Math.floor(distance/(1000*60*60*24));

let h=Math.floor(
(distance%(1000*60*60*24))/
(1000*60*60)
);

let m=Math.floor(
(distance%(1000*60*60))/
(1000*60)
);

let s=Math.floor(
(distance%(1000*60))/1000
);

document.getElementById("days").innerText=
String(d).padStart(2,"0");

document.getElementById("hours").innerText=
String(h).padStart(2,"0");

document.getElementById("minutes").innerText=
String(m).padStart(2,"0");

document.getElementById("seconds").innerText=
String(s).padStart(2,"0");

}

setInterval(updateCountdown,1000);

updateCountdown();

</script>

</body>
</html>
