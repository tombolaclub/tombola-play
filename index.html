<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GRS Tambola</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#101522;
color:#fff;
}
header{
background:#171f35;
padding:16px;
text-align:center;
font-size:25px;
font-weight:bold;
}
.page{display:none;padding:18px;min-height:calc(100vh - 60px)}
.active{display:block}
.card{
max-width:650px;
margin:15px auto;
background:#1c263d;
padding:20px;
border-radius:18px;
box-shadow:0 5px 20px #0008;
}
h1,h2,h3{text-align:center}
button{
width:100%;
padding:15px;
margin:7px 0;
border:0;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
background:#ffca28;
color:#111;
}
.green{background:#43a047;color:white}
.red{background:#e53935;color:white}
.blue{background:#2196f3;color:white}
input{
width:100%;
padding:13px;
margin:6px 0;
border:0;
border-radius:10px;
font-size:16px;
}
.status{
background:#263653;
padding:12px;
border-radius:10px;
text-align:center;
margin-bottom:10px;
}
.big{
font-size:100px;
font-weight:bold;
text-align:center;
color:#ffca28;
margin:10px;
}
.board{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:5px;
}
.num{
padding:9px 2px;
text-align:center;
background:#34415d;
border-radius:6px;
}
.num.called{
background:#ffca28;
color:#111;
font-weight:bold;
}
.previous{
display:flex;
flex-wrap:wrap;
gap:6px;
}
.previous span{
background:#40516f;
padding:8px 12px;
border-radius:20px;
}
.ticket{
display:grid;
grid-template-columns:repeat(9,1fr);
gap:3px;
background:white;
padding:5px;
border-radius:10px;
margin:10px auto;
max-width:500px;
}
.cell{
height:48px;
display:flex;
align-items:center;
justify-content:center;
background:#eee;
color:#111;
font-weight:bold;
font-size:18px;
border-radius:4px;
}
.empty{background:#ccc}
.marked{
background:#43a047!important;
color:white!important;
}
.winner{
background:#43a047;
padding:13px;
margin:6px 0;
border-radius:10px;
text-align:center;
font-weight:bold;
}
.player{
background:#263653;
padding:10px;
border-radius:8px;
margin:5px 0;
}
.small{
font-size:13px;
opacity:.8;
}
</style>
</head>

<body>

<header>🎱 GRS TAMBOLA</header>

<!-- HOME -->
<section id="home" class="page active">
<div class="card">
<h1>🎱 GRS TAMBOLA</h1>
<p style="text-align:center">
Live Online Tambola Game
</p>

<button onclick="showPage('ticketPage')">
START GAME
</button>

<button class="blue" onclick="showPage('adminPage')">
👑 ADMIN / HOST
</button>
</div>
</section>


<!-- TICKET -->
<section id="ticketPage" class="page">
<div class="card">

<h2>🎟️ Generate Ticket</h2>

<input id="playerName" placeholder="Enter your name">

<input id="playerPhone" placeholder="Phone number">

<button onclick="generatePlayer()">
GENERATE MY TICKET
</button>

<div id="ticketPreview"></div>

<button class="green" onclick="joinGame()">
JOIN LIVE GAME
</button>

<button onclick="showPage('home')">
BACK
</button>

</div>
</section>


<!-- GAME -->
<section id="gamePage" class="page">
<div class="card">

<div class="status" id="gameStatus">
Checking game...
</div>

<div class="big" id="currentNumber">-</div>

<div class="board" id="numberBoard"></div>

<h3>Previous Numbers</h3>

<div class="previous" id="previousNumbers"></div>

<h3>🏆 Winners</h3>

<div id="winnerArea"></div>

<h3>🎟️ My Ticket</h3>

<div id="gameTicket"></div>

<button onclick="showPage('home')">
HOME
</button>

</div>
</section>


<!-- ADMIN -->
<section id="adminPage" class="page">
<div class="card">

<h2>👑 Admin Panel</h2>

<input id="adminPassword"
type="password"
placeholder="Admin password">

<button onclick="adminLogin()">
LOGIN
</button>

<div id="adminControls" style="display:none">

<input id="gameTitle"
placeholder="Game title">

<input id="gameDate" type="date">

<input id="gameTime" type="time">

<input id="quickPrize" placeholder="Quick 5 Prize">

<input id="topPrize" placeholder="Top Line Prize">

<input id="middlePrize" placeholder="Middle Line Prize">

<input id="bottomPrize" placeholder="Bottom Line Prize">

<input id="fullPrize" placeholder="Full House Prize">

<button class="blue" onclick="createNewGame()">
CREATE NEW GAME
</button>

<button class="green" onclick="startGame()">
▶ START GAME
</button>

<button class="red" onclick="stopGame()">
⏹ STOP GAME
</button>

<button onclick="drawNumber()">
🎱 DRAW NUMBER
</button>

<button class="blue" onclick="autoDraw()">
▶ AUTO DRAW
</button>

<button class="red" onclick="stopAutoDraw()">
⏹ STOP AUTO DRAW
</button>

<h3>👥 Players</h3>
<div id="playersList"></div>

</div>

<button onclick="showPage('home')">
BACK
</button>

</div>
</section>


<script>

/* =====================================
SUPABASE
===================================== */

const SUPABASE_URL =
"https://ddvkmudxeddfisyqevsz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Z8Wgn7MsuuCl2g1OOdix7g_-QzXOzrf";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================
VARIABLES
===================================== */

let currentGame=null;
let myPlayer=null;
let myTicket=[];
let autoTimer=null;
let lastNumber=null;


/* =====================================
PAGE
===================================== */

function showPage(id){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

if(id==="gamePage"){
loadGame();
}

}


/* =====================================
NUMBER BOARD
===================================== */

const board=
document.getElementById("numberBoard");

for(let i=1;i<=90;i++){

const d=document.createElement("div");

d.className="num";

d.id="num-"+i;

d.innerText=i;

board.appendChild(d);

}


/* =====================================
TICKET GENERATOR
===================================== */

function generateTicket(){

let ticket=[];

for(let r=0;r<3;r++){

let row=new Array(9).fill(null);

let positions=[];

while(positions.length<5){

let p=Math.floor(Math.random()*9);

if(!positions.includes(p)){
positions.push(p);
}

}

positions.sort((a,b)=>a-b);

for(const col of positions){

let min;

let max;

if(col===0){
min=1;
max=9;
}else if(col===8){
min=80;
max=90;
}else{
min=col*10;
max=col*10+9;
}

let n;

do{
n=Math.floor(Math.random()*(max-min+1))+min;
}
while(row.includes(n));

row[col]=n;

}

ticket.push(row);

}

return ticket;

}


/* =====================================
RENDER TICKET
===================================== */

function renderTicket(ticket,id){

const area=document.getElementById(id);

area.innerHTML="";

const box=document.createElement("div");

box.className="ticket";

ticket.forEach(row=>{

row.forEach(n=>{

const cell=document.createElement("div");

cell.className="cell";

if(n===null){

cell.classList.add("empty");

}else{

cell.innerText=n;

cell.dataset.number=n;

}

box.appendChild(cell);

});

});

area.appendChild(box);

}


/* =====================================
GENERATE PLAYER
===================================== */

async function generatePlayer(){

const name=
document.getElementById("playerName")
.value.trim();

const phone=
document.getElementById("playerPhone")
.value.trim();

if(!name){

alert("Name enter karo");

return;
}

myTicket=generateTicket();

renderTicket(
myTicket,
"ticketPreview"
);

alert("Ticket generated!");

}


/* =====================================
CREATE NEW GAME
===================================== */

async function createNewGame(){

const title=
document.getElementById("gameTitle")
.value || "GRS Tambola";

const gameDate=
document.getElementById("gameDate").value;

const gameTime=
document.getElementById("gameTime").value;

const quick=
document.getElementById("quickPrize").value;

const top=
document.getElementById("topPrize").value;

const middle=
document.getElementById("middlePrize").value;

const bottom=
document.getElementById("bottomPrize").value;

const full=
document.getElementById("fullPrize").value;


/* Stop old games */

await db
.from("games")
.update({status:"stopped"})
.eq("status","live");


/* Create game */

const {data,error}=await db
.from("games")
.insert({

title:title,

game_date:gameDate || null,

game_time:gameTime || null,

status:"waiting",

current_number:null,

called_numbers:[]

})
.select()
.single();


if(error){

alert("Game create error: "+error.message);

return;
}

currentGame=data;


/*
Prize information local storage mein
save kar rahe hain.
*/

localStorage.setItem(
"prizes",
JSON.stringify({
quick5:quick,
top:top,
middle:middle,
bottom:bottom,
full:full
})
);

alert("New game created!");

}


/* =====================================
GET CURRENT GAME
===================================== */

async function loadGame(){

const {data,error}=await db
.from("games")
.select("*")
.order("id",{ascending:false})
.limit(1)
.maybeSingle();

if(error){

console.log(error);

return;
}

if(data){

currentGame=data;

updateGameScreen(data);

}

}


/* =====================================
START GAME
===================================== */

async function startGame(){

if(!currentGame){

await loadGame();

}

if(!currentGame){

alert("Pehle New Game create karo");

return;
}

const {data,error}=await db
.from("games")
.update({
status:"live"
})
.eq("id",currentGame.id)
.select()
.single();

if(error){

alert(error.message);

return;
}

currentGame=data;

}


/* =====================================
STOP GAME
===================================== */

async function stopGame(){

if(!currentGame)return;

await db
.from("games")
.update({
status:"stopped"
})
.eq("id",currentGame.id);

stopAutoDraw();

}


/* =====================================
DRAW NUMBER
===================================== */

async function drawNumber(){

if(!currentGame){

await loadGame();

}

if(!currentGame){

alert("Game nahi mila");

return;
}

if(currentGame.status!=="live"){

alert("Game START nahi hai");

return;
}

let called=
currentGame.called_numbers || [];

if(called.length>=90){

alert("All 90 numbers complete!");

return;
}

let number;

do{

number=
Math.floor(Math.random()*90)+1;

}while(called.includes(number));

called.push(number);


const {data,error}=await db
.from("games")
.update({

current_number:number,

called_numbers:called

})
.eq("id",currentGame.id)
.select()
.single();


if(error){

alert("Draw error: "+error.message);

return;
}

currentGame=data;

}


/* =====================================
AUTO DRAW
===================================== */

function autoDraw(){

stopAutoDraw();

drawNumber();

autoTimer=setInterval(
drawNumber,
10000
);

}


function stopAutoDraw(){

if(autoTimer){

clearInterval(autoTimer);

autoTimer=null;

}

}


/* =====================================
VOICE
===================================== */

function speakNumber(n){

if(!n)return;

if(!window.speechSynthesis)return;

const speech=
new SpeechSynthesisUtterance(
"Number "+n
);

speech.rate=.85;

speechSynthesis.cancel();

speechSynthesis.speak(speech);

}


/* =====================================
UPDATE SCREEN
===================================== */

function updateGameScreen(game){

if(!game)return;

document.getElementById(
"gameStatus"
).innerText=
game.status==="live"
?"🟢 GAME LIVE"
:
game.status==="stopped"
?"🔴 GAME STOPPED"
:"🟡 GAME WAITING";


document.getElementById(
"currentNumber"
).innerText=
game.current_number || "-";


document.querySelectorAll(".num")
.forEach(n=>{
n.classList.remove("called");
});


const called=
game.called_numbers || [];


called.forEach(n=>{

const el=
document.getElementById("num-"+n);

if(el){
el.classList.add("called");
}

});


const previous=
document.getElementById(
"previousNumbers"
);

previous.innerHTML="";

called
.slice()
.reverse()
.forEach(n=>{

const span=
document.createElement("span");

span.innerText=n;

previous.appendChild(span);

});


if(
game.current_number &&
game.current_number!==lastNumber
){

lastNumber=game.current_number;

speakNumber(
game.current_number
);

}


updateMyTicket(called);

}


/* =====================================
MARK TICKET
===================================== */

function updateMyTicket(called){

document.querySelectorAll(
"#gameTicket .cell[data-number]"
)
.forEach(cell=>{

const n=
Number(cell.dataset.number);

if(called.includes(n)){

cell.classList.add("marked");

}else{

cell.classList.remove("marked");

}

});

checkWinners();

}


/* =====================================
JOIN GAME
===================================== */

async function joinGame(){

const name=
document.getElementById("playerName")
.value.trim();

const phone=
document.getElementById("playerPhone")
.value.trim();


if(!name){

alert("Name enter karo");

return;
}

if(!myTicket.length){

alert("Pehle ticket generate karo");

return;
}

if(!currentGame){

await loadGame();

}

if(!currentGame){

alert("Game available nahi hai");

return;
}


const {data,error}=await db
.from("players")
.insert({

name:name,

phone:phone,

game_id:currentGame.id,

ticket:myTicket

})
.select()
.single();


if(error){

alert("Player error: "+error.message);

return;
}

myPlayer=data;

localStorage.setItem(
"player_id",
data.id
);

localStorage.setItem(
"player_name",
name
);

renderTicket(
myTicket,
"gameTicket"
);

showPage("gamePage");

}


/* =====================================
CHECK WINNERS
===================================== */

async function checkWinners(){

if(!myPlayer || !myTicket.length || !currentGame)
return;

const called=
currentGame.called_numbers || [];

let all=[];

myTicket.forEach(row=>{

row.forEach(n=>{

if(n!==null)
all.push(n);

});

});

const marked=
all.filter(n=>called.includes(n));


/* QUICK 5 */

if(marked.length>=5){

await claimWinner(
"Quick 5"
);

}


/* TOP */

if(checkRow(
myTicket[0],
called
)){

await claimWinner(
"Top Line"
);

}


/* MIDDLE */

if(checkRow(
myTicket[1],
called
)){

await claimWinner(
"Middle Line"
);

}


/* BOTTOM */

if(checkRow(
myTicket[2],
called
)){

await claimWinner(
"Bottom Line"
);

}


/* FULL HOUSE */

if(marked.length>=15){

await claimWinner(
"Full House"
);

}

}


function checkRow(row,called){

return row
.filter(n=>n!==null)
.every(n=>called.includes(n));

}


/* =====================================
CLAIM WINNER
===================================== */

async function claimWinner(type){

if(!myPlayer || !currentGame)
return;


/*
Check already claimed
*/

const {data}=await db
.from("winners")
.select("id")
.eq("game_id",currentGame.id)
.eq("ticket_id",myPlayer.id)
.eq("prize_type",type)
.limit(1);


if(data && data.length)
return;


const prizes=
JSON.parse(
localStorage.getItem("prizes") || "{}"
);


let prize="";

if(type==="Quick 5")
prize=prizes.quick5 || "";

if(type==="Top Line")
prize=prizes.top || "";

if(type==="Middle Line")
prize=prizes.middle || "";

if(type==="Bottom Line")
prize=prizes.bottom || "";

if(type==="Full House")
prize=prizes.full || "";


await db
.from("winners")
.insert({

game_id:currentGame.id,

ticket_id:myPlayer.id,

prize_type:type,

player_name:myPlayer.name,

prize:prize

});

}


/* =====================================
LOAD WINNERS
===================================== */

async function loadWinners(gameId){

const {data}=await db
.from("winners")
.select("*")
.eq("game_id",gameId)
.order("created_at");

const area=
document.getElementById(
"winnerArea"
);

area.innerHTML="";

(data || []).forEach(w=>{

const div=
document.createElement("div");

div.className="winner";

div.innerHTML=
"🏆 "+w.prize_type+
"<br>👤 "+w.player_name+
(w.prize
?"<br>🎁 "+w.prize
:"");

area.appendChild(div);

});

}


/* =====================================
PLAYERS LIST
===================================== */

async function loadPlayers(){

if(!currentGame)return;

const {data}=await db
.from("players")
.select("*")
.eq("game_id",currentGame.id)
.order("created_at");

const area=
document.getElementById(
"playersList"
);

area.innerHTML="";

(data || []).forEach(p=>{

const div=
document.createElement("div");

div.className="player";

div.innerHTML=
"👤 <b>"+escapeHTML(p.name)+
"</b><br>"+
"<span class='small'>"+
escapeHTML(p.phone || "")+
"</span>";

area.appendChild(div);

});

}


/* =====================================
ADMIN
===================================== */

function adminLogin(){

const pass=
document.getElementById(
"adminPassword"
).value;

if(pass==="1234"){

document.getElementById(
"adminControls"
).style.display="block";

loadGame().then(
loadPlayers
);

}else{

alert("Wrong password");

}

}


/* =====================================
REALTIME
===================================== */

function setupRealtime(){

db.channel("tambola-live")

.on(
"postgres_changes",
{
event:"UPDATE",
schema:"public",
table:"games"
},
payload=>{

currentGame=
payload.new;

updateGameScreen(
payload.new
);

})

.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"winners"
},
payload=>{

if(
currentGame &&
payload.new.game_id===
currentGame.id
){

loadWinners(
currentGame.id
);

}

})

.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"players"
},
payload=>{

if(
currentGame &&
payload.new.game_id===
currentGame.id
){

loadPlayers();

}

})

.subscribe();

}

setupRealtime();


/* =====================================
ESCAPE HTML
===================================== */

function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================
PERIODIC DATA
===================================== */

setInterval(async()=>{

await loadGame();

if(currentGame){

await loadWinners(
currentGame.id
);

}

},5000);


/* =====================================
STARTUP
===================================== */

loadGame();

</script>

</body>
  </html>
