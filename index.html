<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GRS Tambola</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;

color:#fff;

header{

padding:16px;
text-align:center;

font-weight:bold;
}

.page{

.active{display:block}

padding:20px;

button{

.green{background:#43a047;color:white}

input{

padding:13px;
margin:6px 0;
border:0;

font-size:16px;

padding:12px;

.board{

.ticket{

border-radius:10px;

.cell{
height:48px;
display:flex;

justify-content:center;
background:#eee;
color:#111;
font-weight:bold;

border-radius:4px;
}

.empty{background:#ccc}

.marked{
background:#43a047!important;
color:white!important;
}

.winner{

padding:13px;
margin:6px 0;
border-radius:10px;
text-align:center;
font-weight:bold;
}

.player{
background:#263653;
padding:10px;
border-radius:8px;
margin:5px 0;
}

.small{
font-size:13px;
opacity:.8;
}

.info{
background:#263653;
padding:12px;
border-radius:10px;
margin:10px 0;
text-align:center;
}
</style>
</head>

<body>

<div class="card">

-

id="gameTitle"

>

<input
id="gameDate"
type="date"
>

<input
id="gameTime"

>

<input
id="quickPrize"
placeholder="Quick 5 Prize"
>

id="topPrize"
placeholder="Top Line Prize"
>

<input
id="middlePrize"
placeholder="Middle Line Prize"

<input
id="bottomPrize"
placeholder="Bottom Line Prize"

id="fullPrize"

class="blue"
onclick="createNewGame()"

</button>

onclick="startGame()"

class="red"
onclick="stopGame()"
>
⏹ STOP GAME

class="red"

⏹ STOP AUTO DRAW

<script>

/* =====================================
SUPABASE
===================================== */

const SUPABASE_URL =
"https://ddvkmudxeddfisyqevsz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Z8Wgn7MsuuCl2g1OOdix7g_-QzXOzrf";

let db = null;

try {
  db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
} catch(error) {
  console.log("Supabase error:", error);
  alert("Supabase connection error");
}


/* =====================================
VARIABLES
===================================== */

let currentGame = null;

let myPlayer = null;

let myTicket = [];

let myTicketNumber = null;

let autoTimer = null;

let lastNumber = null;


/* =====================================
PAGE
===================================== */

function showPage(id){

document
.querySelectorAll(".page")
.forEach(p =>
p.classList.remove("active")
);

document
.getElementById(id)
.classList.add("active");

if(id === "gamePage"){

loadGame();

}

}


/* =====================================
NUMBER BOARD
===================================== */

const board =
document.getElementById("numberBoard");

for(let i=1;i<=90;i++){

const d =
document.createElement("div");

d.className = "num";

d.id = "num-" + i;

d.innerText = i;

board.appendChild(d);

}


/* =====================================
TICKET GENERATOR
===================================== */

function generateTicket(){

let ticket = [];

for(let r=0;r<3;r++){

let row =
new Array(9).fill(null);

let positions = [];

while(positions.length < 5){

let p =
Math.floor(Math.random()*9);

if(!positions.includes(p)){

positions.push(p);

}

}

positions.sort(
(a,b)=>a-b
);

for(const col of positions){

let min;
let max;

if(col === 0){

min = 1;
max = 9;

}
else if(col === 8){

min = 80;
max = 90;

}
else{

min = col * 10;
max = col * 10 + 9;

}

let n;

do{

n =
Math.floor(
Math.random() *
(max-min+1)
) + min;

}
while(row.includes(n));

row[col] = n;

}

ticket.push(row);

}

return ticket;

}


/* =====================================
GET USED TICKET NUMBERS
===================================== */

async function getUsedTicketNumbers(){

if(!currentGame){

await loadGame();

}

if(!currentGame){

return [];

}

const {data,error} =
await db
.from("players")
.select("ticket")
.eq(
"game_id",
currentGame.id
);

if(error){

console.log(error);

return [];

}

let used = [];

(data || []).forEach(player => {

try{

let t = player.ticket;

if(typeof t === "string"){

t = JSON.parse(t);

}

if(
t &&
t.ticket_number
){

used.push(
Number(t.ticket_number)
);

}

}
catch(e){

console.log(e);

}

});

return used;

}


/* =====================================
GENERATE RANDOM TICKET NUMBER 1-50
===================================== */

async function getRandomTicketNumber(){

const used =
await getUsedTicketNumbers();

let available = [];

for(let i=1;i<=50;i++){

if(!used.includes(i)){

available.push(i);

}

}

if(available.length === 0){

return null;

}

const randomIndex =
Math.floor(
Math.random()*available.length
);

return available[randomIndex];

}


/* =====================================
RENDER TICKET
===================================== */

function renderTicket(
ticket,
id,
ticketNumber=null
){

const area =
document.getElementById(id);

area.innerHTML = "";

if(ticketNumber){

const numberBox =
document.createElement("div");

numberBox.className =
"ticketNumber";

numberBox.innerText =
"🎟️ TICKET NO. " +
ticketNumber;

area.appendChild(numberBox);

}

const box =
document.createElement("div");

box.className = "ticket";

ticket.forEach(row => {

row.forEach(n => {

const cell =
document.createElement("div");

cell.className = "cell";

if(n === null){

cell.classList.add("empty");

}
else{

cell.innerText = n;

cell.dataset.number = n;

}

box.appendChild(cell);

});

});

area.appendChild(box);

}


/* =====================================
GENERATE PLAYER
===================================== */

async function generatePlayer(){

const name =
document
.getElementById("playerName")
.value
.trim();

const phone =
document
.getElementById("playerPhone")
.value
.trim();

if(!name){

alert("Name enter karo");

return;

}


/* Load current game */

await loadGame();

if(!currentGame){

alert(
"Pehle Admin se New Game create karo."
);

return;

}


/* Get available ticket */

const ticketNumber =
await getRandomTicketNumber();

if(ticketNumber === null){

alert(
"Sorry! Is game ke 1 se 50 sabhi tickets already booked hain."
);

return;

}


/* Generate ticket */

myTicket =
generateTicket();

myTicketNumber =
ticketNumber;


/* Show ticket */

renderTicket(
myTicket,
"ticketPreview",
myTicketNumber
);

alert(
"Ticket No. " +
myTicketNumber +
" generated!"
);

}


/* =====================================
CREATE NEW GAME
===================================== */

async function createNewGame(){

const title =
document
.getElementById("gameTitle")
.value ||
"GRS Tambola";

const gameDate =
document
.getElementById("gameDate")
.value;

const gameTime =
document
.getElementById("gameTime")
.value;

const quick =
document
.getElementById("quickPrize")
.value;

const top =
document
.getElementById("topPrize")
.value;

const middle =
document
.getElementById("middlePrize")
.value;

const bottom =
document
.getElementById("bottomPrize")
.value;

const full =
document
.getElementById("fullPrize")
.value;


/* Stop old games */

await db
.from("games")
.update({
status:"stopped"
})
.eq(
"status",
"live"
);


/* Create game */

const {data,error} =
await db
.from("games")
.insert({

title:title,

game_date:
gameDate || null,

game_time:
gameTime || null,

status:"waiting",

current_number:null,

called_numbers:[]

})
.select()
.single();


if(error){

alert(
"Game create error: " +
error.message
);

return;

}

currentGame = data;


/* Save prizes */

localStorage.setItem(
"prizes",
JSON.stringify({

quick5:quick,

top:top,

middle:middle,

bottom:bottom,

full:full

})
);

alert("New game created!");

}


/* =====================================
GET CURRENT GAME
===================================== */

async function loadGame(){

const {data,error} =
await db
.from("games")
.select("*")
.order(
"id",
{
ascending:false
}
)
.limit(1)
.maybeSingle();

if(error){

console.log(error);

return;

}

if(data){

currentGame = data;

updateGameScreen(data);

}

}


/* =====================================
START GAME
===================================== */

async function startGame(){

if(!currentGame){

await loadGame();

}

if(!currentGame){

alert(
"Pehle New Game create karo"
);

return;

}

const {data,error} =
await db
.from("games")
.update({

status:"live"

})
.eq(
"id",
currentGame.id
)
.select()
.single();

if(error){

alert(error.message);

return;

}

currentGame = data;

}


/* =====================================
STOP GAME
===================================== */

async function stopGame(){

if(!currentGame)
return;

await db
.from("games")
.update({

status:"stopped"

})
.eq(
"id",
currentGame.id
);

stopAutoDraw();

}


/* =====================================
DRAW NUMBER
===================================== */

async function drawNumber(){

if(!currentGame){

await loadGame();

}

if(!currentGame){

alert(
"Game nahi mila"
);

return;

}

if(
currentGame.status !== "live"
){

alert(
"Game START nahi hai"
);

return;

}

let called =
currentGame.called_numbers || [];

if(called.length >= 90){

alert(
"All 90 numbers complete!"
);

return;

}

let number;

do{

number =
Math.floor(
Math.random()*90
)+1;

}
while(
called.includes(number)
);

called.push(number);

const {data,error} =
await db
.from("games")
.update({

current_number:number,

called_numbers:called

})
.eq(
"id",
currentGame.id
)
.select()
.single();

if(error){

alert(
"Draw error: " +
error.message
);

return;

}

currentGame = data;

}


/* =====================================
AUTO DRAW
===================================== */

function autoDraw(){

stopAutoDraw();

drawNumber();

autoTimer =
setInterval(
drawNumber,
10000
);

}


function stopAutoDraw(){

if(autoTimer){

clearInterval(
autoTimer
);

autoTimer = null;

}

}


/* =====================================
VOICE
===================================== */

function speakNumber(n){

if(!n)
return;

if(!window.speechSynthesis)
return;

const speech =
new SpeechSynthesisUtterance(
"Number " + n
);

speech.rate = .85;

speechSynthesis.cancel();

speechSynthesis.speak(
speech
);

}


/* =====================================
UPDATE SCREEN
===================================== */

function updateGameScreen(game){

if(!game)
return;

document.getElementById(
"gameStatus"
).innerText =

game.status === "live"
?
"🟢 GAME LIVE"
:
game.status === "stopped"
?
"🔴 GAME STOPPED"
:
"🟡 GAME WAITING";


document.getElementById(
"currentNumber"
).innerText =
game.current_number || "-";


document
.querySelectorAll(".num")
.forEach(n => {

n.classList.remove(
"called"
);

});


const called =
game.called_numbers || [];


called.forEach(n => {

const el =
document.getElementById(
"num-" + n
);

if(el){

el.classList.add(
"called"
);

}

});


const previous =
document.getElementById(
"previousNumbers"
);

previous.innerHTML = "";


called
.slice()
.reverse()
.forEach(n => {

const span =
document.createElement(
"span"
);

span.innerText = n;

previous.appendChild(
span
);

});


if(
game.current_number &&
game.current_number !== lastNumber
){

lastNumber =
game.current_number;

speakNumber(
game.current_number
);

}


updateMyTicket(
called
);

}


/* =====================================
MARK TICKET
===================================== */

function updateMyTicket(called){

document
.querySelectorAll(
"#gameTicket .cell[data-number]"
)
.forEach(cell => {

const n =
Number(
cell.dataset.number
);

if(
called.includes(n)
){

cell.classList.add(
"marked"
);

}
else{

cell.classList.remove(
"marked"
);

}

});

checkWinners();

}


/* =====================================
JOIN GAME
===================================== */

async function joinGame(){

const name =
document
.getElementById("playerName")
.value
.trim();

const phone =
document
.getElementById("playerPhone")
.value
.trim();


if(!name){

alert(
"Name enter karo"
);

return;

}

if(!myTicket.length){

alert(
"Pehle ticket generate karo"
);

return;

}

if(!myTicketNumber){

alert(
"Pehle ticket generate karo"
);

return;

}

if(!currentGame){

await loadGame();

}

if(!currentGame){

alert(
"Game available nahi hai"
);

return;

}


/* Double check ticket number */

const used =
await getUsedTicketNumbers();

if(
used.includes(
myTicketNumber
)
){

alert(
"Ye ticket number already booked hai. Naya ticket generate karo."
);

myTicket = [];

myTicketNumber = null;

document.getElementById(
"ticketPreview"
).innerHTML = "";

return;

}


/* Save ticket number + grid */

const ticketData = {

ticket_number:
myTicketNumber,

grid:
myTicket

};


const {data,error} =
await db
.from("players")
.insert({

name:name,

phone:phone,

game_id:
currentGame.id,

ticket:
ticketData

})
.select()
.single();


if(error){

alert(
"Player error: " +
error.message
);

return;

}

myPlayer = data;


/* Save locally */

localStorage.setItem(
"player_id",
data.id
);

localStorage.setItem(
"player_name",
name
);

localStorage.setItem(
"ticket_number",
myTicketNumber
);


/* Show game ticket */

renderTicket(
myTicket,
"gameTicket",
myTicketNumber
);

showPage(
"gamePage"
);

}


/* =====================================
CHECK WINNERS
===================================== */

async function checkWinners(){

if(
!myPlayer ||
!myTicket.length ||
!currentGame
)
return;

const called =
currentGame.called_numbers || [];

let all = [];


myTicket.forEach(row => {

row.forEach(n => {

if(n !== null){

all.push(n);

}

});

});


const marked =
all.filter(
n => called.includes(n)
);


/* QUICK 5 */

if(marked.length >= 5){

await claimWinner(
"Quick 5"
);

}


/* TOP */

if(
checkRow(
myTicket[0],
called
)
){

await claimWinner(
"Top Line"
);

}


/* MIDDLE */

if(
checkRow(
myTicket[1],
called
)
){

await claimWinner(
"Middle Line"
);

}


/* BOTTOM */

if(
checkRow(
myTicket[2],
called
)
){

await claimWinner(
"Bottom Line"
);

}


/* FULL HOUSE */

if(marked.length >= 15){

await claimWinner(
"Full House"
);

}

}


function checkRow(
row,
called
){

return row
.filter(
n => n !== null
)
.every(
n => called.includes(n)
);

}


/* =====================================
CLAIM WINNER
===================================== */

async function claimWinner(type){

if(
!myPlayer ||
!currentGame
)
return;


/* Check already claimed */

const {data} =
await db
.from("winners")
.select("id")
.eq(
"game_id",
currentGame.id
)
.eq(
"ticket_id",
myPlayer.id
)
.eq(
"prize_type",
type
)
.limit(1);


if(
data &&
data.length
)
return;


const prizes =
JSON.parse(
localStorage.getItem(
"prizes"
) || "{}"
);


let prize = "";


if(type === "Quick 5")
prize =
prizes.quick5 || "";


if(type === "Top Line")
prize =
prizes.top || "";


if(type === "Middle Line")
prize =
prizes.middle || "";


if(type === "Bottom Line")
prize =
prizes.bottom || "";


if(type === "Full House")
prize =
prizes.full || "";


await db
.from("winners")
.insert({

game_id:
currentGame.id,

ticket_id:
myPlayer.id,

prize_type:type,

player_name:
myPlayer.name,

prize:prize

});

}


/* =====================================
LOAD WINNERS
===================================== */

async function loadWinners(
gameId
){

const {data} =
await db
.from("winners")
.select("*")
.eq(
"game_id",
gameId
)
.order(
"created_at"
);


const area =
document.getElementById(
"winnerArea"
);

area.innerHTML = "";


(data || []).forEach(w => {

const div =
document.createElement(
"div"
);

div.className =
"winner";

div.innerHTML =
"🏆 " +
escapeHTML(
w.prize_type
) +
"<br>👤 " +
escapeHTML(
w.player_name
) +
(
w.prize
?
"<br>🎁 " +
escapeHTML(w.prize)
:
""
);

area.appendChild(
div
);

});

}


/* =====================================
PLAYERS LIST
===================================== */

async function loadPlayers(){

if(!currentGame)
return;

const {data} =
await db
.from("players")
.select("*")
.eq(
"game_id",
currentGame.id
)
.order(
"created_at"
);


const area =
document.getElementById(
"playersList"
);

area.innerHTML = "";


(data || []).forEach(p => {

let ticketNo = "";

try{

let t = p.ticket;

if(typeof t === "string"){

t = JSON.parse(t);

}

if(
t &&
t.ticket_number
){

ticketNo =
t.ticket_number;

}

}
catch(e){}


const div =
document.createElement(
"div"
);

div.className =
"player";

div.innerHTML =
"👤 <b>" +
escapeHTML(p.name) +
"</b>" +
"<br>🎟️ Ticket No: <b>" +
escapeHTML(ticketNo) +
"</b>" +
"<br><span class='small'>" +
escapeHTML(p.phone || "") +
"</span>";

area.appendChild(
div
);

});
