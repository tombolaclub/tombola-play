<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GRS Tambola</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #101522; color: #fff; }
header { background: #171f35; padding: 16px; text-align: center; font-size: 25px; font-weight: bold; }
.page { display: none; padding: 18px; min-height: calc(100vh - 60px); }
.active { display: block; }
.card { max-width: 650px; margin: 15px auto; background: #1c263d; padding: 20px; border-radius: 18px; box-shadow: 0 5px 20px #0008; }
h1, h2, h3 { text-align: center; }

button { width: 100%; padding: 15px; margin: 7px 0; border: 0; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; background: #ffca28; color: #111; }
.green { background: #43a047; color: white; }
.red { background: #e53935; color: white; }
.blue { background: #2196f3; color: white; }
button:disabled { opacity: 0.6; cursor: not-allowed; }

input { width: 100%; padding: 13px; margin: 6px 0; border: 0; border-radius: 10px; font-size: 16px; }
.status { background: #263653; padding: 12px; border-radius: 10px; text-align: center; margin-bottom: 10px; }
.big { font-size: 80px; font-weight: bold; text-align: center; color: #ffca28; margin: 10px; }

.board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
.num { padding: 9px 2px; text-align: center; background: #34415d; border-radius: 6px; font-size: 13px; }
.num.called { background: #ffca28; color: #111; font-weight: bold; }

.previous { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
.previous span { background: #40516f; padding: 6px 10px; border-radius: 15px; font-size: 14px; }

.ticketCard { background: #1c263d; border: 2px solid #34415d; border-radius: 12px; padding: 12px; margin-bottom: 15px; transition: 0.2s; }
.ticketCard.selected { border-color: #ffca28; box-shadow: 0 0 12px rgba(255, 202, 40, 0.4); }
.ticketCard.booked { opacity: 0.5; border-color: #e53935; pointer-events: none; }
.ticketHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; }

.ticket { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; background: white; padding: 5px; border-radius: 8px; margin: 8px 0; }
.cell { height: 40px; display: flex; align-items: center; justify-content: center; background: #eee; color: #111; font-weight: bold; font-size: 16px; border-radius: 4px; }
.cell.empty { background: #ccc; }
.cell.marked { background: #43a047 !important; color: white !important; }

.winner { background: #43a047; padding: 10px; margin: 6px 0; border-radius: 8px; text-align: center; font-weight: bold; }
.info { background: #263653; padding: 12px; border-radius: 10px; margin: 10px 0; text-align: center; }
.ticketContainer { max-height: 400px; overflow-y: auto; padding-right: 5px; }
.flex-row { display: flex; gap: 10px; }
</style>
</head>

<body>

<header>🎱 GRS TAMBOLA</header>

<!-- HOME -->
<section id="home" class="page active">
  <div class="card">
    <h1>🎱 GRS TAMBOLA</h1>
    <p style="text-align:center">Live Online Tambola Game</p>
    <button onclick="showPage('ticketPage')">START GAME</button>
    <button class="blue" onclick="showPage('adminPage')">👑 ADMIN / HOST</button>
  </div>
</section>

<!-- TICKET SELECTION -->
<section id="ticketPage" class="page">
  <div class="card">
    <h2>🎟️ Select Tickets</h2>
    <input id="playerName" placeholder="Enter your name">
    <input id="playerPhone" placeholder="Phone number">

    <div class="info">
      🎟️ Total: <b>50</b> | 🔴 Booked: <b id="bookedTickets">0</b> | 🟢 Available: <b id="availableTickets">50</b>
    </div>

    <div class="info">Select 1 or Multiple Tickets Below:</div>
    <div id="ticketNumbers" class="ticketContainer"></div>

    <div class="info">Selected Tickets: <b id="selectedTicketText">None</b></div>

    <button class="green" onclick="joinGame()">JOIN LIVE GAME</button>
    <button onclick="showPage('home')">BACK</button>
  </div>
</section>

<!-- GAME PAGE -->
<section id="gamePage" class="page">
  <div class="card">
    <div class="status" id="gameStatus">Checking game...</div>
    
    <div style="text-align: center; margin: 5px;">
      <label><input type="checkbox" id="voiceToggle" checked> 🔊 Voice Caller</label>
    </div>

    <div class="big" id="currentNumber">-</div>

    <div class="board" id="numberBoard"></div>

    <h3>Previous Numbers</h3>
    <div class="previous" id="previousNumbers"></div>

    <h3>🏆 Winners</h3>
    <div id="winnerArea"></div>

    <h3>🎟️ My Tickets</h3>
    <div id="myTicketsContainer"></div>

    <button onclick="showPage('home')">HOME</button>
  </div>
</section>

<!-- ADMIN PAGE -->
<section id="adminPage" class="page">
  <div class="card">
    <h2>👑 Admin Panel</h2>
    <input id="adminPassword" type="password" placeholder="Admin password">
    <button onclick="adminLogin()">LOGIN</button>

    <div id="adminControls" style="display:none">
      <input id="gameTitle" placeholder="Game title">
      <div class="flex-row">
        <input id="gameDate" type="date">
        <input id="gameTime" type="time">
      </div>
      <input id="quickPrize" placeholder="Quick 5 Prize">
      <input id="topPrize" placeholder="Top Line Prize">
      <input id="middlePrize" placeholder="Middle Line Prize">
      <input id="bottomPrize" placeholder="Bottom Line Prize">
      <input id="fullPrize" placeholder="Full House Prize">

      <button class="blue" onclick="createNewGame()">CREATE NEW GAME</button>
      <button class="green" onclick="startGame()">▶ START GAME</button>
      <button class="red" onclick="stopGame()">⏹ STOP GAME</button>
      <button onclick="drawNumber()">🎱 DRAW NUMBER</button>
      <button class="blue" onclick="autoDraw()">▶ AUTO DRAW (10s)</button>
      <button class="red" onclick="stopAutoDraw()">⏹ STOP AUTO DRAW</button>
    </div>

    <button onclick="showPage('home')">BACK</button>
  </div>
</section>

<script>
/* SUPABASE CONFIG */
const SUPABASE_URL = "https://ddvkmudxeddfisyqevsz.supabase.co";
const SUPABASE_KEY = "sb_publishable_Z8Wgn7MsuuCl2g1OOdix7g_-QzXOzrf";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* VARIABLES */
let currentGame = null;
let selectedTickets = []; // Multi-ticket selection
let myJoinedTickets = [];
let autoTimer = null;
let lastNumber = null;
let realtimeSubscription = null;

/* INIT BOARD */
const board = document.getElementById("numberBoard");
for (let i = 1; i <= 90; i++) {
  const d = document.createElement("div");
  d.className = "num";
  d.id = "num-" + i;
  d.innerText = i;
  board.appendChild(d);
}

/* NAVIGATION */
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  if (id === "gamePage") {
    loadGame();
    setupRealtime();
  } else if (id === "ticketPage") {
    selectedTickets = [];
    document.getElementById("selectedTicketText").innerText = "None";
    showTicketNumbers();
  }
}

/* FIXED SEED TICKET GENERATOR */
function generateFixedTicket(seed) {
  function pseudoRandom(s) {
    let x = Math.sin(s++) * 10000;
    return x - Math.floor(x);
  }
  let ticket = [];
  let currentSeed = seed * 100;

  for (let r = 0; r < 3; r++) {
    let row = new Array(9).fill(null);
    let positions = [];

    while (positions.length < 5) {
      let p = Math.floor(pseudoRandom(currentSeed++) * 9);
      if (!positions.includes(p)) positions.push(p);
    }
    positions.sort((a, b) => a - b);

    for (const col of positions) {
      let min = col === 0 ? 1 : col * 10;
      let max = col === 8 ? 90 : col * 10 + 9;
      let n;
      do {
        n = Math.floor(pseudoRandom(currentSeed++) * (max - min + 1)) + min;
      } while (row.includes(n));
      row[col] = n;
    }
    ticket.push(row);
  }
  return ticket;
}

/* LOAD GAME */
async function loadGame() {
  const { data, error } = await db.from("games").select("*").order("id", { ascending: false }).limit(1).maybeSingle();
  if (!error && data) {
    currentGame = data;
    updateGameScreen(data);
  }
}

/* FETCH BOOKED TICKETS */
async function getUsedTicketNumbers() {
  if (!currentGame) await loadGame();
  if (!currentGame) return [];

  const { data, error } = await db.from("players").select("ticket").eq("game_id", currentGame.id);
  if (error) return [];

  let used = [];
  (data || []).forEach(player => {
    try {
      let t = typeof player.ticket === "string" ? JSON.parse(player.ticket) : player.ticket;
      if (t && t.ticket_number) {
        if (Array.isArray(t.ticket_number)) {
          used.push(...t.ticket_number.map(Number));
        } else {
          used.push(Number(t.ticket_number));
        }
      }
    } catch (e) {}
  });
  return used;
}

/* SHOW AVAILABLE TICKETS (MULTI SELECT) */
async function showTicketNumbers() {
  await loadGame();
  const area = document.getElementById("ticketNumbers");
  if (!currentGame) {
    area.innerHTML = "<div class='info'>No active game. Ask Admin to create one.</div>";
    return;
  }

  const used = await getUsedTicketNumbers();
  document.getElementById("bookedTickets").innerText = used.length;
  document.getElementById("availableTickets").innerText = 50 - used.length;

  area.innerHTML = "";

  for (let i = 1; i <= 50; i++) {
    const isBooked = used.includes(i);
    const ticketGrid = generateFixedTicket(i);

    const card = document.createElement("div");
    card.className = "ticketCard" + (isBooked ? " booked" : "");
    if (selectedTickets.includes(i)) card.classList.add("selected");

    const header = document.createElement("div");
    header.className = "ticketHeader";
    header.innerHTML = `<span>🎟️ Ticket #${i}</span> <span style="color:${isBooked ? '#e53935' : '#43a047'}">${isBooked ? 'BOOKED' : 'AVAILABLE'}</span>`;
    card.appendChild(header);

    const gridBox = document.createElement("div");
    gridBox.className = "ticket";
    ticketGrid.forEach(row => {
      row.forEach(n => {
        const cell = document.createElement("div");
        cell.className = "cell" + (n === null ? " empty" : "");
        if (n !== null) cell.innerText = n;
        gridBox.appendChild(cell);
      });
    });
    card.appendChild(gridBox);

    if (!isBooked) {
      card.style.cursor = "pointer";
      card.onclick = function () {
        if (selectedTickets.includes(i)) {
          selectedTickets = selectedTickets.filter(num => num !== i);
          card.classList.remove("selected");
        } else {
          selectedTickets.push(i);
          card.classList.add("selected");
        }
        document.getElementById("selectedTicketText").innerText = selectedTickets.length ? selectedTickets.join(", ") : "None";
      };
    }
    area.appendChild(card);
  }
}

/* JOIN GAME WITH MULTIPLE TICKETS */
async function joinGame() {
  const name = document.getElementById("playerName").value.trim();
  const phone = document.getElementById("playerPhone").value.trim();

  if (!name) return alert("Please enter your name");
  if (selectedTickets.length === 0) return alert("Please select at least 1 ticket");

  await loadGame();
  if (!currentGame) return alert("Game not available");

  const used = await getUsedTicketNumbers();
  const conflict = selectedTickets.some(num => used.includes(num));
  if (conflict) {
    alert("One of your selected tickets is already booked. Refreshing list...");
    return showTicketNumbers();
  }

  const myTicketsData = selectedTickets.map(num => ({
    ticket_number: num,
    grid: generateFixedTicket(num)
  }));

  const { data, error } = await db.from("players").insert({
    name: name,
    phone: phone,
    game_id: currentGame.id,
    ticket: { ticket_number: selectedTickets, tickets_list: myTicketsData }
  }).select().single();

  if (error) return alert("Error joining: " + error.message);

  myJoinedTickets = myTicketsData;
  renderMyGameTickets();
  showPage("gamePage");
}

/* RENDER PLAYER'S TICKETS IN GAME PAGE */
function renderMyGameTickets() {
  const container = document.getElementById("myTicketsContainer");
  container.innerHTML = "";

  myJoinedTickets.forEach(tObj => {
    const wrapper = document.createElement("div");
    wrapper.className = "ticketCard";
    wrapper.innerHTML = `<div class="ticketHeader">🎟️ Ticket #${tObj.ticket_number}</div>`;

    const box = document.createElement("div");
    box.className = "ticket";

    tObj.grid.forEach(row => {
      row.forEach(n => {
        const cell = document.createElement("div");
        cell.className = "cell" + (n === null ? " empty" : "");
        if (n !== null) {
          cell.innerText = n;
          cell.dataset.number = n;
        }
        box.appendChild(cell);
      });
    });

    wrapper.appendChild(box);
    container.appendChild(wrapper);
  });
}

/* REALTIME UPDATES */
function setupRealtime() {
  if (realtimeSubscription) return;

  realtimeSubscription = db
    .channel('public:games')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'games' }, payload => {
      if (currentGame && payload.new.id === currentGame.id) {
        currentGame = payload.new;
        updateGameScreen(payload.new);
      }
    })
    .subscribe();
}

/* UPDATE GAME SCREEN & VOICE */
function updateGameScreen(game) {
  if (!game) return;

  document.getElementById("gameStatus").innerText =
    game.status === "live" ? "🟢 GAME LIVE" : game.status === "stopped" ? "🔴 GAME STOPPED" : "🟡 GAME WAITING";

  document.getElementById("currentNumber").innerText = game.current_number || "-";

  document.querySelectorAll(".num").forEach(n => n.classList.remove("called"));

  const called = game.called_numbers || [];
  called.forEach(n => {
    const el = document.getElementById("num-" + n);
    if (el) el.classList.add("called");
  });

  const previous = document.getElementById("previousNumbers");
  previous.innerHTML = "";
  called.slice().reverse().forEach(n => {
    const span = document.createElement("span");
    span.innerText = n;
    previous.appendChild(span);
  });

  if (game.current_number && game.current_number !== lastNumber) {
    lastNumber = game.current_number;
    if (document.getElementById("voiceToggle").checked) speakNumber(game.current_number);
  }

  updateMyTicketsMarking(called);
  loadWinners(game.id);
}

/* AUTO-MARK PLAYER TICKETS */
function updateMyTicketsMarking(called) {
  document.querySelectorAll("#myTicketsContainer .cell[data-number]").forEach(cell => {
    const n = Number(cell.dataset.number);
    if (called.includes(n)) cell.classList.add("marked");
    else cell.classList.remove("marked");
  });
  checkWinners(called);
}

/* SPEECH SYNTHESIS */
function speakNumber(n) {
  if (!window.speechSynthesis) return;
  const speech = new SpeechSynthesisUtterance("Number " + n);
  speech.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(speech);
}

/* ADMIN ACTIONS */
function adminLogin() {
  if (document.getElementById("adminPassword").value === "1234") {
    document.getElementById("adminPassword").style.display = "none";
    document.querySelector("#adminPage button").style.display = "none";
    document.getElementById("adminControls").style.display = "block";
  } else {
    alert("Wrong Password");
  }
}

async function createNewGame() {
  const title = document.getElementById("gameTitle").value || "GRS Tambola";
  let gameDate = document.getElementById("gameDate").value;
  let gameTime = document.getElementById("gameTime").value;

  await db.from("games").update({ status: "stopped" }).eq("status", "live");

  const { data, error } = await db.from("games").insert({
    title: title,
    game_date: gameDate || new Date().toISOString().split('T')[0],
    game_time: gameTime || "20:00",
    status: "waiting",
    current_number: null,
    called_numbers: []
  }).select().single();

  if (error) return alert("Game create error: " + error.message);
  currentGame = data;
  alert("New game created!");
}

async function startGame() {
  if (!currentGame) await loadGame();
  if (!currentGame) return alert("Create game first!");

  const { data, error } = await db.from("games").update({ status: "live" }).eq("id", currentGame.id).select().single();
  if (!error) { currentGame = data; updateGameScreen(data); }
}

async function stopGame() {
  if (!currentGame) return;
  const { data } = await db.from("games").update({ status: "stopped" }).eq("id", currentGame.id).select().single();
  if (data) { currentGame = data; updateGameScreen(data); stopAutoDraw(); }
}

async function drawNumber() {
  if (!currentGame) await loadGame();
  if (!currentGame || currentGame.status !== "live") return alert("Game is not LIVE!");

  let called = currentGame.called_numbers || [];
  if (called.length >= 90) return alert("All 90 numbers called!");

  let number;
  do { number = Math.floor(Math.random() * 90) + 1; } while (called.includes(number));

  called.push(number);
  const { data, error } = await db.from("games").update({
    current_number: number,
    called_numbers: called
  }).eq("id", currentGame.id).select().single();

  if (!error) { currentGame = data; updateGameScreen(data); }
}

function autoDraw() {
  stopAutoDraw();
  drawNumber();
  autoTimer = setInterval(drawNumber, 10000);
}

function stopAutoDraw() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
}

/* WINNER CLAIMS & DISPLAY */
async function checkWinners(called) {
  if (!myJoinedTickets.length || !currentGame) return;

  for (let tObj of myJoinedTickets) {
    let all = tObj.grid.flat().filter(n => n !== null);
    let marked = all.filter(n => called.includes(n));

    if (marked.length >= 5) await claimWinner("Quick 5", tObj.ticket_number);
    if (tObj.grid[0].filter(n => n !== null).every(n => called.includes(n))) await claimWinner("Top Line", tObj.ticket_number);
    if (tObj.grid[1].filter(n => n !== null).every(n => called.includes(n))) await claimWinner("Middle Line", tObj.ticket_number);
    if (tObj.grid[2].filter(n => n !== null).every(n => called.includes(n))) await claimWinner("Bottom Line", tObj.ticket_number);
    if (marked.length >= 15) await claimWinner("Full House", tObj.ticket_number);
  }
}

async function claimWinner(type, ticketNum) {
  const { data } = await db.from("winners").select("id").eq("game_id", currentGame.id).eq("prize_type", type).limit(1);
  if (data && data.length > 0) return;

  const pName = document.getElementById("playerName").value.trim() || "Player";
  await db.from("winners").insert({
    game_id: currentGame.id,
    player_name: `${pName} (T#${ticketNum})`,
    prize_type: type
  });
  loadWinners(currentGame.id);
}

async function loadWinners(gameId) {
  if (!gameId) return;
  const { data } = await db.from("winners").select("*").eq("game_id", gameId);
  const area = document.getElementById("winnerArea");
  if (!area) return;

  area.innerHTML = "";
  (data || []).forEach(w => {
    const div = document.createElement("div");
    div.className = "winner";
    div.innerText = `🎉 ${w.prize_type}: ${w.player_name}`;
    area.appendChild(div);
  });
}
</script>
</body>
</html>
